name: digital_susu
description: >-
  Digital Susu V2 — Ghana-first digital savings, susu, wallet, contribution,
  group-management and financial-record platform.
publish_to: "none"

# Major.Minor.Patch+BuildNumber — V2 project.
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / state management
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking (used from Phase 2 onward)
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets are registered here as they are added (e.g. design references,
  # logos, fonts). No assets are bundled in Phase 1.
  # assets:
  #   - assets/images/
